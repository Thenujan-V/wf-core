# Texts of notifications and emails. {{name}} is replaced by a value; an unknown name becomes empty.
# A customer's own file (wms.notification.templates) replaces any of these keys.

TASK_ASSIGNED.title=New task: {{taskName}}
TASK_ASSIGNED.body=You have a new task "{{taskName}}" for {{reference}}.

TASK_AVAILABLE.title=Task available: {{taskName}}
TASK_AVAILABLE.body=A task "{{taskName}}" for {{reference}} is waiting for someone in your group to claim it.

TASK_REMINDER.title=Reminder: {{taskName}}
TASK_REMINDER.body=Your task "{{taskName}}" for {{reference}} is still waiting for you.

TASK_OVERDUE.title=Overdue: {{taskName}}
TASK_OVERDUE.body=Your task "{{taskName}}" for {{reference}} has passed its deadline.

REQUEST_FINISHED.title=Your request {{reference}} is {{outcome}}
REQUEST_FINISHED.body=Your {{processKey}} request {{reference}} has finished: {{outcome}}.

DOCUMENT_SHARED.title=A folder was shared with you: {{folderName}}
DOCUMENT_SHARED.body=You now have {{permission}} access to the folder "{{folderName}}".

# Added to the end of a notification's email.
email.link=Open it: {{url}}

# Emails a process sends with its "send email" step: process.<template>.subject and .body.
process.default.subject=Update on {{reference}}
process.default.body=There is an update on your {{processKey}} request {{reference}}.
process.request-approved.subject=Approved: {{reference}}
process.request-approved.body=Your {{processKey}} request {{reference}} has been approved.
process.request-rejected.subject=Not approved: {{reference}}
process.request-rejected.body=Your {{processKey}} request {{reference}} was not approved.
