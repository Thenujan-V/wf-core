server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: workflow-service
  datasource:
    url: ${WMS_WORKFLOW_DB_URL:jdbc:mysql://localhost:3306/wms_workflow}
    username: ${WMS_WORKFLOW_DB_USER:wms_workflow}
    password: ${WMS_WORKFLOW_DB_PASSWORD:wms_workflow}
  rabbitmq:
    host: ${WMS_RABBIT_HOST:localhost}
    port: ${WMS_RABBIT_PORT:5672}
    username: ${WMS_RABBIT_USER:wms}
    password: ${WMS_RABBIT_PASSWORD:wms}
    publisher-confirm-type: simple
    connection-timeout: 5s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${WMS_OIDC_ISSUER:http://localhost:8180/realms/wms}
          audiences:
            - wms-api

wms:
  outbox:
    enabled: true
    poll-interval: PT1S
    batch-size: 100
  workflow:
    stats:
      # The dashboard's figures are the same for everyone, so each period is worked out at most this often.
      cache-ttl: PT30S
    identity:
      base-url: ${WMS_IDENTITY_URL:http://localhost:8087}
      token-url: ${WMS_OIDC_ISSUER:http://localhost:8180/realms/wms}/protocol/openid-connect/token
      client-id: ${WMS_WORKFLOW_CLIENT_ID:wms-workflow}
      client-secret: ${WMS_WORKFLOW_CLIENT_SECRET:dev-workflow-secret}
      connect-timeout: 2s
      read-timeout: 5s
    forms:
      base-url: ${WMS_FORM_URL:http://localhost:8083}
      connect-timeout: 2s
      read-timeout: 5s
    security:
      # Which token claim is the user id. AuraDOCS keys users by preferred_username without the email domain.
      user-id-claim: ${WMS_USER_ID_CLAIM:sub}
      strip-email-domain: ${WMS_USER_ID_STRIP_EMAIL_DOMAIN:false}
    directory:
      # identity: identity-service (stand-alone WMS); auradocs: AuraDOCS owns users, departments, groups and roles.
      provider: ${WMS_DIRECTORY_PROVIDER:identity}
      auradocs:
        base-url: ${WMS_AURADOCS_DIRECTORY_URL:http://localhost:9191/integration/v1/directory}
        connect-timeout: 2s
        read-timeout: 5s
        cache-ttl: 60s
    calendar:
      zone: UTC
      weekend: [SATURDAY, SUNDAY]
      holidays: []
    jobs:
      enabled: true
      poll-interval: PT1S
      batch-size: 20
      lease: PT5M
    webhooks:
      connect-timeout: 5s
      read-timeout: 10s
      allow-private-networks: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
